<!DOCTYPE html>
<html>
<head>
    <title>Attendance Management System</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        table {
            margin: auto;
            border-collapse: collapse;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
        }

        th {
            background-color: lightblue;
        }

        button {
            padding: 5px 10px;
        }
    </style>
</head>

<body>

    <h1>Attendance Management System</h1>

    <p>
        Date:
        <input type="date" id="date">
    </p>

    <table>
        <tr>
            <th>Roll No</th>
            <th>Name</th>
            <th>Attendance</th>
        </tr>

        <tr>
            <td>1</td>
            <td>Rahul</td>
            <td>
                <button onclick="markPresent(this)">Present</button>
                <button onclick="markAbsent(this)">Absent</button>
            </td>
        </tr>

        <tr>
            <td>2</td>
            <td>Priya</td>
            <td>
                <button onclick="markPresent(this)">Present</button>
                <button onclick="markAbsent(this)">Absent</button>
            </td>
        </tr>

        <tr>
            <td>3</td>
            <td>Amit</td>
            <td>
                <button onclick="markPresent(this)">Present</button>
                <button onclick="markAbsent(this)">Absent</button>
            </td>
        </tr>

        <tr>
            <td>4</td>
            <td>Sneha</td>
            <td>
                <button onclick="markPresent(this)">Present</button>
                <button onclick="markAbsent(this)">Absent</button>
            </td>
        </tr>
    </table>

    <h2 id="message"></h2>

    <script>

        function markPresent(button) {
            button.parentElement.parentElement.style.backgroundColor = "lightgreen";
            document.getElementById("message").innerHTML = "Attendance marked Present";
        }

        function markAbsent(button) {
            button.parentElement.parentElement.style.backgroundColor = "pink";
            document.getElementById("message").innerHTML = "Attendance marked Absent";
        }

    </script>

</body>
</html>
